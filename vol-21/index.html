<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vol.21 Bond of Mother and Child · 모자의 인연 — KPE Archive Showcase</title>
<meta name="description" content="A quiet photographic meditation set in Taegangneung Royal Tomb. This is not a guide to Korea. It is a way of feeling it.">

<meta property="og:type" content="article">
<meta property="og:site_name" content="KPE Archive Showcase">
<meta property="og:title" content="Vol.21 Bond of Mother and Child · 모자의 인연">
<meta property="og:description" content="A quiet photographic meditation set in Taegangneung Royal Tomb. This is not a guide to Korea. It is a way of feeling it.">
<meta property="og:image" content="https://paulsb1961-star.github.io/kpe-showcase/images/vol21_overture_img.jpg">
<meta property="og:url" content="https://paulsb1961-star.github.io/kpe-showcase/vol-21/">
<meta name="twitter:card" content="summary_large_image">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* Layout: a museum catalogue. Each scene is a plate: the photograph, and beside it a wall label with names, place, coordinates and the narration. */
:root {
  --paper: #F1F1EC;
  --ink: #1A1A2E;
  --ink-soft: #4A4A5C;
  --rule: #CFCFC6;
  --gold: #8E6E14;
  --plate: #E6E6DF;
  --en: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --kr: "Noto Serif KR", "KoPubWorld Batang", "AppleMyungjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1A1A2E; --ink: #ECE7DA; --ink-soft: #B3AEA2; --rule: #3A3A52; --gold: #D4AF37; --plate: #222238;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1A1A2E; --ink: #ECE7DA; --ink-soft: #B3AEA2; --rule: #3A3A52; --gold: #D4AF37; --plate: #222238;
  color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--kr); font-size: 16px; line-height: 1.75; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
a { color: inherit; }
a:focus-visible, button:focus-visible, audio:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.en { font-family: var(--en); }
.label { font-family: var(--en); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
.mast .brand { font-family: var(--en); font-size: 18px; letter-spacing: .08em; text-decoration: none; }
.mast .brand b { font-weight: 600; }
.mast .back { font-size: 14px; color: var(--ink-soft); text-decoration: none; }
.mast .back:hover { color: var(--ink); }
h1 { font-family: var(--en); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1.1; margin: 36px 0 6px; text-wrap: balance; }
.h1kr { font-size: clamp(18px, 2.6vw, 22px); margin: 0; color: var(--ink-soft); }
.lede { max-width: 62ch; margin: 18px 0 0; color: var(--ink-soft); }
.route { list-style: none; padding: 0; margin: 34px 0 8px; display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.route li { flex: 1 1 150px; padding: 12px 14px; border-left: 1px solid var(--rule); min-width: 0; }
.route li:first-child { border-left: 0; padding-left: 0; }
.route a { text-decoration: none; display: grid; gap: 2px; }
.route .n { font-family: var(--en); font-size: 13px; color: var(--gold); font-variant-numeric: tabular-nums; }
.route .t { font-size: 15px; }
.route a:hover .t { text-decoration: underline; text-underline-offset: 4px; }
.plate { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; padding-block: 56px; border-bottom: 1px solid var(--rule); align-items: start; scroll-margin-top: 20px; }
.plate figure { margin: 0; background: var(--plate); padding: 14px; }
.plate img { display: block; width: 100%; height: auto; }
.plate figcaption { font-family: var(--en); font-size: 13px; color: var(--ink-soft); margin-top: 10px; letter-spacing: .04em; }
.card { min-width: 0; display: grid; gap: 18px; }
.card h2 { font-family: var(--en); font-weight: 400; font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.card h2 small { display: block; font-family: var(--kr); font-size: 17px; color: var(--ink-soft); margin-top: 4px; }
.desc { display: grid; gap: 8px; }
.desc p { margin: 0; }
.desc .en { font-size: 19px; line-height: 1.55; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; font-size: 14px; border-top: 1px solid var(--rule); padding-top: 14px; }
.meta dt { font-family: var(--en); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--ink-soft); padding-top: 2px; }
.meta dd { margin: 0; font-variant-numeric: tabular-nums; }
.listen { display: grid; gap: 8px; }
.listen audio { width: 100%; max-width: 440px; }
.soon { font-size: 14px; color: var(--ink-soft); border: 1px dashed var(--rule); padding: 10px 14px; max-width: 440px; }
.script { border-left: 2px solid var(--gold); padding-left: 18px; display: grid; gap: 6px; }
.script .col { display: grid; gap: 8px; }
.script p { margin: 0; }
.script .hd { font-weight: 600; }
.script .col.en p { font-size: 18px; line-height: 1.55; }
.script p.ko { font-size: 16px; }
.script p.en { font-size: 18px; line-height: 1.55; }
.script p.en + p.ko, .script p.ko + p.en { margin-top: 10px; }
.vol .t { font-size: 19px !important; }
.script .verse { color: var(--gold); font-style: italic; }
.buy { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; }
.btn { display: inline-block; font-family: var(--en); font-size: 17px; letter-spacing: .04em; padding: 12px 22px; border: 1px solid var(--ink); text-decoration: none; }
.btn:hover { background: var(--ink); color: var(--paper); }
.buy p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 46ch; }
.vols { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 28px 24px; margin-top: 36px; }
.vol { text-decoration: none; display: grid; gap: 10px; }
.vol .img { background: var(--plate); padding: 12px; }
.vol img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
.vol .n { font-family: var(--en); color: var(--gold); font-size: 14px; letter-spacing: .1em; }
.vol .t { font-family: var(--en); font-size: 22px; line-height: 1.2; }
.vol .k { font-size: 15px; color: var(--ink-soft); }
.vol:hover .t { text-decoration: underline; text-underline-offset: 4px; }
.note { margin-top: 32px; color: var(--ink-soft); font-size: 14px; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); font-family: var(--en); font-size: 14px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.err { margin-top: 40px; color: var(--ink-soft); }
@media (max-width: 760px) {
  .plate { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 40px; }
  .plate figure { max-width: 420px; }
  .route li { flex-basis: 45%; border-left: 0; padding-left: 0; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <a class="brand" href="#"><b>KPE Archive</b> · Showcase</a>
    <a class="back" id="back" href="#" hidden>← All volumes · 전체 목록</a>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>
    <span>© 2026 HongSahn Media · Hong Sahn</span>
    <span>An Archive of Emotional Time</span>
  </footer>
</div>
<script>window.KPE_ROOT='../';window.KPE_VOL='21';</script>
<script src="../data/showcase_data.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var back = document.getElementById('back');
  var INL = window.KPE_INLINE || null, AST = window.KPE_ASSET || null;
  var ROOT = window.KPE_ROOT || '', FIXED = window.KPE_VOL || null, IDX = location.protocol === 'file:' ? 'index.html' : '', HOME = ROOT ? ROOT + IDX : '#';
  document.querySelector('.mast .brand').setAttribute('href', HOME); back.setAttribute('href', HOME);
  var cache = {};
  function src(p) { return (AST && AST[p]) || ROOT + p; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function getJSON(p) {
    if (INL && INL[p]) return Promise.resolve(INL[p]);
    if (cache[p]) return Promise.resolve(cache[p]);
    return fetch(ROOT + p).then(function (r) { if (!r.ok) throw new Error(p); return r.json(); }).then(function (d) { cache[p] = d; return d; });
  }
  function coord(lat, lng) { if (lat == null || lng == null) return ''; return Math.abs(lat).toFixed(4) + '° ' + (lat >= 0 ? 'N' : 'S') + ', ' + Math.abs(lng).toFixed(4) + '° ' + (lng >= 0 ? 'E' : 'W'); }
  function mmss(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function hub() {
    back.hidden = true;
    getJSON('data/volumes.json').then(function (vols) {
      app.innerHTML =
        '<h1>Korean Photo Essay Showcase</h1>' +
        '<p class="h1kr">한국 포토에세이 진열창</p>' +
        '<p class="lede">Each volume opens with its Prelude, then one scene from every episode: the photograph, its description, and the narration you can hear. 권마다 서시와 이야기별 한 장면을 사진과 설명, 그리고 낭독으로 보여 드립니다.</p>' +
        '<div class="vols">' + vols.map(function (v) {
          return '<a class="vol" href="' + ROOT + 'vol-' + esc(v.vol) + '/' + IDX + '"><div class="img"><img src="' + src('images/' + v.cover) + '" alt="' + esc(v.title_en) + '" loading="lazy"></div>' +
            '<span class="n">VOL. ' + esc(v.vol) + '</span>' +
            '<span class="t">' + esc(v.title_en) + '</span><span class="k">' + esc(v.title_kr) + ' · ' + esc(v.place_kr) + '</span></a>';
        }).join('') + '</div>';
    }).catch(fail);
  }
  function plate(x, total) {
    var pre = x.scene === 1;
    var label = pre ? 'Scene 1 · 서시 · Prelude' : 'Scene ' + x.scene + ' · ' + esc(x.scene_name) + ' · ' + esc(x.scene_name_en);
    var h = '<section class="plate" id="scene-' + x.scene + '">' +
      '<figure><img src="' + src('images/' + x.image) + '" alt="' + esc(x.alt_text_en) + '" loading="lazy">' +
      '<figcaption>Plate ' + x.scene + ' / ' + total + ' · ' + esc(x.global_id) + '</figcaption></figure>' +
      '<div class="card"><div><p class="label">' + label + '</p>' +
      '<h2>' + esc(x.title_en) + '<small>' + esc(x.title_kr) + '</small></h2></div>';
    if (!pre) h += '<div class="desc"><p class="en" lang="en">' + esc(x.alt_text_en) + '.</p><p lang="ko">' + esc(x.alt_text_kr) + '</p></div>';
    h += '<div class="listen"><p class="label">' + (pre ? 'Audiobook preview · 미리듣기' : 'Narration · 낭독 (EN → KR)') + ' · ' + mmss(x.audio.seconds) + '</p>' +
      '<audio controls preload="none" src="' + src('audio/' + x.audio.file) + '"></audio></div>';
    if (pre && x.transcript) {
      h += '<div class="script">' + x.transcript.map(function (l) {
        return '<p class="' + l.lang + (l.head ? ' hd' : '') + '" lang="' + (l.lang === 'ko' ? 'ko' : 'en') + '">' + esc(l.text) + '</p>';
      }).join('') + '</div>';
    }
    h += '<dl class="meta">' +
      (x.place ? '<dt>Place</dt><dd>' + esc(x.place) + '</dd>' : '') +
      (x.year ? '<dt>Year</dt><dd>' + esc(x.year) + '</dd>' : '') +
      (x.lat != null ? '<dt>Coordinates</dt><dd>' + coord(x.lat, x.lng) + '</dd>' : '') +
      (x.emotion_tags ? '<dt>Mood</dt><dd>' + esc(x.emotion_tags) + '</dd>' : '') +
      '</dl></div></section>';
    return h;
  }
  function volume(id) {
    back.hidden = false;
    getJSON('data/volumes.json').then(function (vols) {
      var v = vols.filter(function (x) { return x.vol === id; })[0];
      if (!v) throw new Error('vol');
      return getJSON('data/' + v.data);
    }).then(function (d) {
      var s = d.scenes;
      var html =
        '<p class="label" style="margin-top:36px">Vol. ' + esc(d.volume) + ' · ' + esc((s[0].place || '').split(' / ')[0]) + '</p>' +
        '<h1 style="margin-top:8px">' + esc(d.title_en) + '</h1>' +
        '<p class="h1kr">' + esc(d.title_kr) + ' · ' + esc(d.author) + '</p>' +
        '<ol class="route" aria-label="Scenes">' + s.map(function (x) {
          return '<li><a href="#vol-' + esc(d.volume) + '" data-scene="' + x.scene + '"><span class="n">' + x.scene + ' / ' + s.length + '</span><span class="t">' + esc(x.scene_name) + ' · <span class="en">' + esc(x.scene_name_en) + '</span></span></a></li>';
        }).join('') + '</ol>' +
        s.map(function (x) { return plate(x, s.length); }).join('') +
        '<div class="buy"><a class="btn" href="' + esc(d.buy_link) + '" target="_blank" rel="noopener">Read the full book · 책 보기</a>' +
        '<p>The full essay, verses and photographs are in the book. 에세이 전문과 시구, 전체 사진은 책에서 만나실 수 있습니다.</p></div>';
      app.innerHTML = html;
      Array.prototype.forEach.call(app.querySelectorAll('audio'), function (a) {
        a.addEventListener('error', function () { var n = document.createElement('p'); n.className = 'soon'; n.textContent = 'Narration coming soon · 낭독 음원 준비 중'; a.replaceWith(n); });
      });
      Array.prototype.forEach.call(app.querySelectorAll('.route a'), function (l) {
        l.addEventListener('click', function (e) { e.preventDefault(); var t = document.getElementById('scene-' + l.getAttribute('data-scene')); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
      });
    }).catch(fail);
  }
  function fail() {
    app.innerHTML = '<p class="err">데이터 파일을 불러오지 못했습니다. data 폴더가 이 페이지와 같은 곳에 있는지 확인해 주세요.<br><span lang="en">This page could not load its data. Check that the data folder sits next to this page.</span></p>';
  }
  function route() {
    var m = /^vol-(\d{2})$/.exec(location.hash.replace('#', ''));
    if (FIXED) volume(FIXED); else if (m) volume(m[1]); else hub();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
